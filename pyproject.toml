[project]
name = "codeowners"
version = "0.9.0"
description = "Codeowners parser for Python"
authors = [{ name = "Steve Dignam", email = "steve@dignam.xyz" }]
readme = "README.md"
license = "MIT"
keywords = ["codeowners", "git", "github"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/sbdchd/codeowners"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.8",
    "pytest>=8",
    "ipython>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeowners"]

[tool.ruff.lint]
# defaults (E4, E7, E9, F) plus import sorting (replaces isort)
extend-select = ["I"]

[tool.pytest.ini_options]
filterwarnings = [
    # all warnings that are not ignored should raise an error
    "error",
]
